services:
  - type: web
    name: uth-cloudbot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: DATA_BACKEND
        value: local
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_TIMEOUT_SECONDS
        value: "30"
    healthCheckPath: /api/health
