<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTH CloudBot — Trợ lý sinh viên</title>
<link rel="stylesheet" href="../src/css/style.css">
</head>
<body>

  <div class="app">

    <header class="header">
      <div class="header__mark">UTH</div>
      <div class="header__text">
        <h1>UTH CloudBot</h1>
        <p>Thẻ tra cứu dành cho sinh viên</p>
      </div>
      <div class="header__status" id="statusPill">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Đang kiểm tra kết nối…</span>
      </div>
    </header>

    <main class="chat" id="chat">
      <div class="chat__scroll" id="chatScroll">
        <div class="msg msg--bot">
          <div class="msg__tab">BOT</div>
          <div class="msg__bubble">
            <p>Chào bạn! Mình là CloudBot — hỏi mình về học phí, lịch học, lịch thi hoặc tài liệu môn học nhé.</p>
          </div>
        </div>
      </div>
    </main>

    <form class="composer" id="composerForm">
      <input type="text" id="questionInput" class="composer__input" placeholder="Nhập câu hỏi của bạn…" autocomplete="off" maxlength="500" />
      <button type="submit" class="composer__send" id="sendBtn" aria-label="Gửi">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M2 10L18 2L11 18L9 11L2 10Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>

  </div>

  <template id="botMsgTemplate">
    <div class="msg msg--bot">
      <div class="msg__tab">BOT</div>
      <div class="msg__bubble">
        <span class="msg__source-badge"></span>
        <p class="msg__answer"></p>
        <p class="msg__disclaimer" hidden></p>
        <div class="msg__meta">
          <span class="msg__source"></span>
          <span class="msg__time"></span>
        </div>
        <div class="msg__feedback">
          <button type="button" class="fb-btn fb-up" aria-label="Câu trả lời hữu ích">👍</button>
          <button type="button" class="fb-btn fb-down" aria-label="Câu trả lời chưa đúng">👎</button>
          <span class="msg__fb-thanks"></span>
        </div>
      </div>
    </div>
  </template>

  <template id="userMsgTemplate">
    <div class="msg msg--user"><div class="msg__bubble"></div></div>
  </template>

  <template id="loadingMsgTemplate">
    <div class="msg msg--bot msg--loading">
      <div class="msg__tab">BOT</div>
      <div class="msg__bubble">
        <span class="typing"><span></span><span></span><span></span></span>
      </div>
    </div>
  </template>

  <template id="errorMsgTemplate">
    <div class="msg msg--error">
      <div class="msg__bubble">
        <p>⚠ Không kết nối được máy chủ (hoặc quá thời gian chờ). Kiểm tra mạng và thử lại — câu hỏi của bạn sẽ được giữ nguyên.</p>
        <button type="button" class="retry-btn">Thử lại</button>
      </div>
    </div>
  </template>

  <script src="../src/js/config.js"></script>
  <script src="../src/js/script.js"></script>
</body>
</html>
