<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTH Chatbot — Trợ lý sinh viên</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/css/style.css">
</head>
<body>

<div class="shell">

  <!-- ===== Top bar (spans logo cell + main + aside) ===== -->
  <div class="logo-cell">
    <span class="logo"><strong>UTH</strong> CHATBOT</span>
  </div>

  <div class="topbar">
    <div class="tabs" id="tabGroup">
      <button class="tab is-active" data-tab="chung">Trợ lý chung</button>
      <button class="tab" data-tab="hocvu">Học vụ</button>
      <button class="tab" data-tab="taichinh">Tài chính</button>
    </div>
    <div class="topbar-right">
      <span class="api-badge" id="apiBadge">MOCK</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Đổi giao diện sáng/tối">
        <span class="toggle-knob"></span>
      </button>
      <div class="avatar avatar--user" title="Huy">SV</div>
    </div>
  </div>

  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <button class="new-chat" id="newChatBtn">
      <span class="plus">+</span> Cuộc trò chuyện mới
    </button>

    <div class="history">
      <p class="history-label">Hôm qua</p>
      <button class="history-item" data-title="Học phí học kỳ 1">
        <span class="hist-ico">💬</span><span>Học phí học kỳ 1</span>
      </button>
      <button class="history-item" data-title="Thủ tục xin bảo lưu">
        <span class="hist-ico">💬</span><span>Thủ tục xin bảo lưu</span>
      </button>

      <p class="history-label">Tuần trước</p>
      <button class="history-item" data-title="Lịch thi cuối kỳ ở đâu">
        <span class="hist-ico">💬</span><span>Lịch thi cuối kỳ ở đâu</span>
      </button>
      <button class="history-item" data-title="Cách đăng ký môn học">
        <span class="hist-ico">💬</span><span>Cách đăng ký môn học</span>
      </button>

      <p class="history-label">Tháng trước</p>
      <button class="history-item" data-title="Xin cấp lại thẻ sinh viên">
        <span class="hist-ico">💬</span><span>Xin cấp lại thẻ sinh viên</span>
      </button>
    </div>
  </aside>

  <!-- ===== Main chat column ===== -->
  <main class="main">

    <div class="empty-state" id="emptyState">
      <p class="watermark">UTH<br><span>CHATBOT</span></p>
      <div class="suggest-cards">
        <button class="suggest-card" data-q="Học phí kỳ này là bao nhiêu?">
          <strong>Học phí kỳ này</strong>
          <span>là bao nhiêu, hạn đóng khi nào</span>
        </button>
        <button class="suggest-card" data-q="Lịch thi cuối kỳ ở đâu?">
          <strong>Lịch thi cuối kỳ</strong>
          <span>xem ở đâu, khi nào công bố</span>
        </button>
        <button class="suggest-card" data-q="Làm sao để đăng ký môn học?">
          <strong>Đăng ký môn học</strong>
          <span>quy trình và thời gian mở cổng</span>
        </button>
      </div>
    </div>

    <div class="thread" id="thread" hidden></div>

    <div class="error-banner" id="errorBanner" hidden>
      <span>⚠ Không thể kết nối máy chủ. Vui lòng thử lại.</span>
      <button id="retryBtn">Thử lại</button>
    </div>

    <p class="input-error" id="inputError" hidden>Vui lòng nhập câu hỏi trước khi gửi.</p>
    <form class="input-row" id="chatForm" autocomplete="off" novalidate>
      <input
        type="text"
        id="chatInput"
        placeholder="Nhập câu hỏi của bạn..."
        aria-label="Nhập câu hỏi"
        maxlength="300"
      >
      <button type="submit" id="sendBtn" class="send-btn" aria-label="Gửi">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1.5 8H14.5M14.5 8L9 2.5M14.5 8L9 13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </main>

  <!-- ===== Sources panel ===== -->
  <aside class="aside" id="sourcesPanel">
    <p class="aside-empty" id="sourcesEmpty">
      Các liên kết <strong>tài liệu</strong> và <strong>nguồn tham khảo</strong> cho câu trả lời sẽ hiển thị ở đây
    </p>
    <div class="aside-content" id="sourcesContent" hidden>
      <h2>Nguồn tham khảo cho <strong>câu trả lời này</strong></h2>
      <div class="source-list" id="sourceList"></div>
    </div>
  </aside>

</div>

<script src="../src/js/script.js"></script>
</body>
</html>
